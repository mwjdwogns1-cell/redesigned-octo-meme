<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 올인원 2.0 구독</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top-left">
                <button><i class="fa-solid fa-phone"></i> 전체목록 A/S</button>
                <button><i class="fa-solid fa-shield-halved"></i> 오늘보장</button>
                <button><i class="fa-solid fa-graduation-cap"></i> 수능보장</button>
            </div>
            <div class="header-main">
                <h1>블루패스로 새로워진<br>AI 올인원 2.0 구독</h1>
                <div class="header-features">
                    <button><i class="fa-solid fa-brain"></i> AI 시간케어</button>
                    <button><i class="fa-solid fa-user-tie"></i> 매니저</button>
                    <button><i class="fa-solid fa-clock-rotate-left"></i> 시간보충</button>
                    <button><i class="fa-solid fa-microchip"></i> 스마트청소</button>
                </div>
            </div>
        </header>

        <nav>
            <button class="active"><i class="fa-solid fa-border-all"></i> 전체</button>
            <button><i class="fa-solid fa-magnifying-glass-chart"></i> 전문분석</button>
            <button><i class="fa-solid fa-box-open"></i> 소모품분석</button>
            <button><i class="fa-solid fa-book"></i> 생기부케어</button>
            <button><i class="fa-solid fa-arrows-spin"></i> 재수</button>
            <button class="highlight"><i class="fa-solid fa-star"></i> 후기 이벤트</button>
        </nav>

        <main class="video-grid">
        </main>

        <footer>
            <input type="text" id="youtube-url" placeholder="추가할 YouTube URL 입력">
            <select id="category-select">
                <option>카테고리 선택</option>
                <option>전문분석</option>
                <option>소모품분석</option>
                <option>생기부케어</option>
                <option>재수</option>
            </select>
            <button id="add-video-btn">비디오 추가</button>
        </footer>
    </div>

    <script src="script.js"></script>

</body>
</html>
