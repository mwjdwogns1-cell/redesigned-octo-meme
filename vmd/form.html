<!-- 지점 제출용 모바일 화면 · Apps Script 파일명: form -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root{
    --navy:#0B1B4D; --blue:#1428A0; --blue2:#2B47D6;
    --bg:#F4F6FB; --card:#fff; --line:#E3E8F4; --txt:#1A1D2E; --sub:#7A83A0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
    font-size:15px;line-height:1.5;padding-bottom:110px}
  header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;
    padding:18px 18px 20px;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px}
  header p{margin:4px 0 0;font-size:12.5px;opacity:.75}
  .wrap{padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:12px}
  label.tit{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:9px}
  label.tit .req{color:#E0393E;margin-left:3px}
  select,input[type=text],input[type=date],textarea{
    width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;background:#fff;color:var(--txt);appearance:none}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue2)}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%237A83A0' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center}
  textarea{min-height:76px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{flex:1 1 46%;position:relative}
  .chip input{position:absolute;opacity:0;pointer-events:none}
  .chip span{display:block;text-align:center;padding:13px 8px;border:1.5px solid var(--line);
    border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);background:#fff;
    transition:.12s}
  .chip input:checked + span{background:var(--blue);border-color:var(--blue);color:#fff}
  .photobtn{display:block;text-align:center;padding:22px;border:2px dashed #C3CCE6;
    border-radius:12px;color:var(--blue);font-weight:700;background:#FAFBFF}
  #files{display:none}
  .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
  .th{position:relative;padding-top:100%;border-radius:8px;overflow:hidden;background:#E9EDF7}
  .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .th b{position:absolute;top:3px;right:3px;width:20px;height:20px;line-height:20px;
    text-align:center;background:rgba(11,27,77,.82);color:#fff;border-radius:50%;
    font-size:13px;font-weight:400;cursor:pointer}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  button.go{width:100%;padding:16px;border:0;border-radius:12px;background:var(--blue);
    color:#fff;font-size:16.5px;font-weight:700;font-family:inherit}
  button.go:disabled{background:#B9C1D8}
  .prog{height:6px;background:#E3E8F4;border-radius:99px;overflow:hidden;margin-bottom:10px;display:none}
  .prog i{display:block;height:100%;width:0;background:var(--blue2);transition:.25s}
  .done{text-align:center;padding:70px 26px}
  .done .ico{font-size:52px}
  .done h2{margin:16px 0 8px;font-size:20px;color:var(--navy)}
  .done p{color:var(--sub);margin:0 0 26px;font-size:14px}
  .done button{padding:14px 30px;border:0;border-radius:11px;background:var(--blue);
    color:#fff;font-weight:700;font-size:15px;font-family:inherit}
  .err{background:#FFF1F0;border:1px solid #FFCFCC;color:#C0292E;padding:12px;
    border-radius:10px;font-size:13.5px;margin-bottom:12px;display:none}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>삼성스토어 VMD 제출</h1>
    <p>대구·경북 <span id="wk"></span></p>
  </header>

  <div class="wrap">
    <div class="err" id="err"></div>

    <div class="card">
      <label class="tit" for="store">지점 <span class="req">*</span></label>
      <select id="store">
        <option value="">— 지점 선택 —</option>
        <? for (var i = 0; i < stores.length; i++) { ?>
          <option value="<?= stores[i] ?>" <?= stores[i] === preStore ? 'selected' : '' ?>><?= stores[i] ?></option>
        <? } ?>
      </select>
      <div style="height:12px"></div>
      <label class="tit" for="who">제출자 <span class="req">*</span></label>
      <input type="text" id="who" placeholder="이름" autocomplete="name">
    </div>

    <div class="card">
      <label class="tit">제출 항목 <span class="req">*</span> <span style="font-weight:400;color:var(--sub)">복수 선택 가능</span></label>
      <div class="chips" id="chips">
        <? for (var i = 0; i < items.length; i++) { ?>
          <label class="chip"><input type="checkbox" value="<?= items[i] ?>"><span><?= items[i] ?></span></label>
        <? } ?>
      </div>
    </div>

    <div class="card">
      <label class="tit" for="shot">촬영일</label>
      <input type="date" id="shot">
    </div>

    <div class="card">
      <label class="tit">사진 <span style="font-weight:400;color:var(--sub)">최대 <?= maxPhotos ?>장</span></label>
      <label class="photobtn" for="files">📷 사진 선택 / 촬영</label>
      <input type="file" id="files" accept="image/*" multiple>
      <div class="thumbs" id="thumbs"></div>
      <div class="hint">폰에서 자동으로 용량을 줄여 올립니다. 원본 화질 그대로 선택하셔도 됩니다.</div>
    </div>

    <div class="card">
      <label class="tit" for="note">특이사항</label>
      <textarea id="note" placeholder="본사 확인이 필요한 내용, 자재 부족, 현장 이슈 등"></textarea>
    </div>
  </div>

  <div class="bar">
    <div class="prog" id="prog"><i></i></div>
    <button class="go" id="go">제출하기</button>
  </div>
</div>

<div id="done" class="done" style="display:none">
  <div class="ico">✅</div>
  <h2>제출 완료</h2>
  <p id="doneMsg"></p>
  <button onclick="location.reload()">추가로 제출하기</button>
</div>

<script>
var MAX_SIDE = <?= maxSide ?>, MAX_N = <?= maxPhotos ?>;
var picked = [];  // {dataUrl, blobData, mime}

/* --- 초기화 --- */
(function(){
  var d = new Date(), p = function(n){return (n<10?'0':'')+n;};
  document.getElementById('shot').value = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  var ws = new Date(d); ws.setDate(ws.getDate() - ((ws.getDay()+6)%7));
  var we = new Date(ws); we.setDate(we.getDate()+6);
  document.getElementById('wk').textContent =
    '· ' + (ws.getMonth()+1)+'/'+ws.getDate()+'~'+(we.getMonth()+1)+'/'+we.getDate()+' 주차';

  try {
    var s = localStorage.getItem('vmd_store'), w = localStorage.getItem('vmd_who');
    if (s && !document.getElementById('store').value) document.getElementById('store').value = s;
    if (w) document.getElementById('who').value = w;
  } catch(e){}
})();

/* --- 사진 선택 + 압축 --- */
document.getElementById('files').addEventListener('change', function(ev){
  var list = Array.prototype.slice.call(ev.target.files);
  ev.target.value = '';
  list.forEach(function(f){
    if (picked.length >= MAX_N) return;
    if (f.type.indexOf('image/') !== 0) return;
    shrink(f, function(o){ picked.push(o); draw(); });
  });
});

function shrink(file, cb){
  var fr = new FileReader();
  fr.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height, r = Math.min(1, MAX_SIDE / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * r); cv.height = Math.round(h * r);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var url = cv.toDataURL('image/jpeg', 0.82);
      cb({ dataUrl: url, data: url.split(',')[1], mime: 'image/jpeg' });
    };
    img.src = e.target.result;
  };
  fr.readAsDataURL(file);
}

function draw(){
  var box = document.getElementById('thumbs');
  box.innerHTML = '';
  picked.forEach(function(p, i){
    var d = document.createElement('div');
    d.className = 'th';
    d.innerHTML = '<img src="'+p.dataUrl+'"><b data-i="'+i+'">×</b>';
    box.appendChild(d);
  });
  Array.prototype.forEach.call(box.querySelectorAll('b'), function(b){
    b.onclick = function(){ picked.splice(+b.dataset.i, 1); draw(); };
  });
}

/* --- 제출 --- */
document.getElementById('go').onclick = function(){
  var store = document.getElementById('store').value;
  var who   = document.getElementById('who').value.trim();
  var items = Array.prototype.slice.call(document.querySelectorAll('#chips input:checked'))
                .map(function(c){ return c.value; });

  if (!store) return fail('지점을 선택해주세요.');
  if (!who)   return fail('제출자 이름을 입력해주세요.');
  if (!items.length) return fail('제출 항목을 1개 이상 선택해주세요.');

  try { localStorage.setItem('vmd_store', store); localStorage.setItem('vmd_who', who); } catch(e){}

  lock(true);
  var meta = {
    store: store, reporter: who, items: items,
    shotDate: document.getElementById('shot').value,
    note: document.getElementById('note').value
  };

  google.script.run
    .withSuccessHandler(function(res){ upload(res, 0); })
    .withFailureHandler(function(e){ lock(false); fail(e.message || '제출에 실패했습니다.'); })
    .createSubmission(meta);
};

function upload(res, i){
  if (i >= picked.length) {
    google.script.run
      .withSuccessHandler(function(){ finish(picked.length); })
      .withFailureHandler(function(){ finish(picked.length); })
      .finalizeSubmission(res.row, picked.length);
    return;
  }
  setProg((i / Math.max(picked.length, 1)) * 100);
  google.script.run
    .withSuccessHandler(function(){ upload(res, i + 1); })
    .withFailureHandler(function(e){ lock(false); fail('사진 ' + (i+1) + '장째 업로드 실패: ' + (e.message||'')); })
    .addPhoto(res.folderId, res.prefix, i + 1, { data: picked[i].data, mimeType: picked[i].mime });
}

function finish(n){
  setProg(100);
  document.getElementById('app').style.display = 'none';
  document.getElementById('done').style.display = 'block';
  document.getElementById('doneMsg').textContent =
    '사진 ' + n + '장이 정상 접수되었습니다.\n담당 VMD가 확인 후 회신드립니다.';
  window.scrollTo(0, 0);
}

function lock(on){
  var b = document.getElementById('go');
  b.disabled = on;
  b.textContent = on ? '전송 중…' : '제출하기';
  document.getElementById('prog').style.display = on ? 'block' : 'none';
  if (!on) setProg(0);
}
function setProg(p){ document.querySelector('#prog i').style.width = p + '%'; }
function fail(m){
  var e = document.getElementById('err');
  e.textContent = m; e.style.display = 'block';
  window.scrollTo(0, 0);
  setTimeout(function(){ e.style.display = 'none'; }, 5000);
}
</script>
</body>
</html>
